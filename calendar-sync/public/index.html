<!doctype html><html lang='nl'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Agenda Sync</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;padding:20px}a,button{display:inline-block;padding:10px 15px;margin:5px;border:0;border-radius:6px;background:#d7ad01;color:#000;text-decoration:none;cursor:pointer}pre{background:#111;color:#eee;padding:15px;border-radius:8px;overflow:auto}</style></head><body><h1>Agenda Sync</h1><p>Google Calendar ↔ Microsoft 365, met een ICS-bron als leesagenda.</p><p><a href='/api/calendar/google'>Koppel Google</a><a href='/api/calendar/microsoft'>Koppel Microsoft 365</a><button id='sync'>Nu synchroniseren</button></p><pre id='out'>laden…</pre><script>async function refresh(){const h=await fetch('/api/calendar/health').then(r=>r.json());const s=await fetch('/api/calendar/state').then(r=>r.json());document.getElementById('out').textContent=JSON.stringify({...h,state:s},null,2)}document.getElementById('sync').onclick=async()=>{const r=await fetch('/api/calendar/sync',{method:'POST'});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2);refresh()};refresh()</script></body></html>
